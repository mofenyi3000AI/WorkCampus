<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B2642" />
  <title>Work@Campus · University of Limpopo</title>
  <meta name="description" content="Work@Campus - jobs, walking buddies, study partners and a quiet food bank for University of Limpopo students." />
  <link rel="icon" href="/assets/logo.jpg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="offline-banner" class="banner hidden">You are offline. Reconnect to post or reply.</div>
  <div id="welcome" class="welcome">
    <div class="logo-wrap"><img src="/assets/logo.jpg" alt="Work@Campus" /></div>
    <p class="tiny" style="color:#E8C85A;margin:16px 0 8px;font-weight:700;">UNIVERSITY OF LIMPOPO</p>
    <h1>Work@Campus</h1>
    <p class="slogan">Connecting students. Empowering students.</p>
    <div class="faces">
      <img src="/assets/face1.jpg" alt="" />
      <img src="/assets/face2.jpg" alt="" />
    </div>
    <div class="faces-wide"><img src="/assets/friends.jpg" alt="" /></div>
    <p class="lead">A little extra money. A plate of food when the month is long. Friends who will walk you home and sit with an assignment.</p>
    <button class="btn gold" data-go="login">Log in or join</button>
    <button class="btn ghost" style="margin-top:10px;color:#1B2642;" data-go="home" data-demo="1">Have a look around</button>
    <button class="btn ghost" style="margin-top:8px;color:#1B2642;" data-go="terms">House rules</button>
  </div>
  <div class="app-wrap">
    <nav class="nav hidden" id="nav">
      <button data-go="home">Home</button>
      <button data-go="gigs">Gigs</button>
      <button data-go="walk">Walk</button>
      <button data-go="help">Help</button>
      <button data-go="me">Me</button>
    </nav>
    <main class="app">
      <section class="screen" id="view-login"></section>
      <section class="screen" id="view-home"></section>
      <section class="screen" id="view-gigs"></section>
      <section class="screen" id="view-gig"></section>
      <section class="screen" id="view-walk"></section>
      <section class="screen" id="view-study"></section>
      <section class="screen" id="view-help"></section>
      <section class="screen" id="view-post"></section>
      <section class="screen" id="view-me"></section>
      <section class="screen" id="view-shop"></section>
      <section class="screen" id="view-admin"></section>
      <section class="screen" id="view-terms"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/js/app.js"></script>
</body>
</html>
